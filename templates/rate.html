{% extends "base.html" %}

{% block content %}

<h2>Оценка дня</h2>

<p>
    Заполни несколько полей, чтобы получить результат.
</p>


{% if error %}

<div class="error">
    {{ error }}
</div>

{% endif %}


<form action="{{ url_for('calculate') }}" method="POST">

    <label for="sleep">
        Сколько часов ты спал?
    </label>

    <input
        type="number"
        id="sleep"
        name="sleep"
        min="0"
        max="24"
        step="0.5"
        required
    >


    <label for="work">
        Сколько часов ты работал или учился?
    </label>

    <input
        type="number"
        id="work"
        name="work"
        min="0"
        max="24"
        step="0.5"
        required
    >


    <label for="mood">
        Оцени своё настроение от 1 до 10:
    </label>

    <input
        type="number"
        id="mood"
        name="mood"
        min="1"
        max="10"
        required
    >


    <label>
        Была ли сегодня физическая активность?
    </label>

    <div class="radio-group">

        <label>
            <input
                type="radio"
                name="sport"
                value="yes"
                required
            >
            Да
        </label>

        <label>
            <input
                type="radio"
                name="sport"
                value="no"
            >
            Нет
        </label>

    </div>


    <button type="submit">
        Рассчитать
    </button>

</form>

{% endblock %}
